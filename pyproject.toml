[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-ai"
version = "0.1.0"
description = "Leakage-aware, imbalance-focused fraud detection research on the synthetic BAF benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AI/ML Portfolio Project" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "scikit-learn>=1.5,<2",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
fraud-lab = "fraud_detection.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
